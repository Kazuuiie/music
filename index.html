<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Rain on Glass — Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
  #app { width: 100vw; height: 100vh; }
  #ui {
    position: absolute; left: 16px; bottom: 16px;
    background: rgba(18,23,31,0.72); border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(14px); border-radius: 12px; padding: 12px 14px;
    font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; color: #e7edf5;
  }
  #ui button {
    background: #8ec7ff; color: #071018; border: none; border-radius: 8px;
    font-size: 12px; font-weight: 600; padding: 7px 14px; cursor: pointer;
  }
  #ui p { margin: 0 0 8px; color: #93a1b4; }
  #file-input { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <p>Shader mưa trên kính (code của bạn, đã fix lỗi GLSL ES1/ES3)</p>
  <button id="pick-btn">Tải ảnh của bạn</button>
</div>
<input type="file" id="file-input" accept="image/*">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="x-shader/x-vertex" id="rain-vert">
out vec2 uvInterpolator;

void main() {
  uvInterpolator = uv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
</script>

<script type="x-shader/x-fragment" id="rain-frag">
in vec2 uvInterpolator;
uniform float u_time;
uniform sampler2D u_texture;
out vec4 outColor;

float hash1(vec2 p) {
  return fract(sin(dot(p, vec2(123.456, 43.12))) * 45678.912);
}
vec2 hash2(vec2 p) {
  vec2 q = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return fract(sin(q) * 43758.5453);
}

// Simulates one circular drop as a hemispherical lens: bends light more near
// the rim than at the center, and adds a specular glint where the curved
// surface catches the light. Returns vec3(refraction.xy, specular).
vec3 dropLens(vec2 localPos, float radius) {
  float d = length(localPos);
  if (d >= radius) return vec3(0.0);

  vec2 n2 = localPos / radius;                    // 0 at center, 1 at rim
  float z = sqrt(max(0.0, 1.0 - dot(n2, n2)));     // hemisphere height: 1 center, 0 rim
  vec3 normal = normalize(vec3(n2, z));

  vec2 refraction = n2 * (1.0 - z);                // curved lens bend, soft at center

  vec3 lightDir = normalize(vec3(-0.35, 0.5, 0.7));
  float spec = pow(max(dot(normal, lightDir), 0.0), 40.0);

  float edgeFade = smoothstep(radius, radius * 0.85, d); // soft outer edge, no hard circle
  return vec3(refraction * edgeFade, spec * edgeFade);
}

// Tiny droplets that stay put on the glass, gently shimmering — most real
// condensation never moves, it just clings there.
vec3 staticDroplets(vec2 uv, float density, float seed) {
  vec2 guv = uv * density;
  vec2 cell = floor(guv);
  vec2 f = fract(guv) - 0.5;

  vec2 rnd = hash2(cell + seed);
  if (rnd.x > 0.45) return vec3(0.0); // keep it sparse

  vec2 center = (rnd - 0.5) * 0.6;
  float radius = 0.14 + rnd.y * 0.12;
  vec3 lens = dropLens(f - center, radius);

  float shimmer = 0.9 + 0.1 * sin(u_time * 0.8 + rnd.x * 30.0);
  return lens * shimmer;
}

// Bigger drops that slide down under gravity and leave a wet streak behind
// them — this is what actually reads as "rain running down glass".
vec3 fallingDrops(vec2 uv, float columns, float seed) {
  vec2 guv = uv * vec2(columns, columns * 0.55);
  vec2 cell = floor(guv);
  vec2 f = fract(guv) - 0.5;

  vec2 rnd = hash2(cell + seed);
  float speed = 0.12 + rnd.x * 0.30;
  float phase = fract(u_time * speed + rnd.y * 8.0);

  float headY = mix(0.65, -0.65, phase);   // travels top to bottom of its cell
  float posX = (rnd.y - 0.5) * 0.5;
  float radius = 0.09 + rnd.x * 0.06;

  vec3 lens = dropLens(f - vec2(posX, headY), radius);

  // Trail: thin, fading streak between the drop's starting point and its
  // current position, narrowing slightly as it stretches.
  float trailTop = 0.65;
  float alongTrail = clamp((trailTop - f.y) / max(trailTop - headY, 0.001), 0.0, 1.0);
  float trailWidth = radius * 0.30 * (1.0 - alongTrail * 0.5);
  float inTrail = step(headY, f.y) * step(f.y, trailTop)
                * smoothstep(trailWidth, trailWidth * 0.3, abs(f.x - posX));
  vec2 trailRefr = vec2(sign(f.x - posX) * 0.012, 0.0) * inTrail * (1.0 - alongTrail) * 0.6;

  float fadeInOut = smoothstep(0.0, 0.12, phase) * smoothstep(1.0, 0.9, phase);
  return vec3((lens.xy + trailRefr) * fadeInOut, lens.z * fadeInOut);
}

void main() {
  vec2 uv = uvInterpolator;

  vec3 result = vec3(0.0);
  result += fallingDrops(uv, 9.0, 42.0);
  result += fallingDrops(uv * 1.3 + 4.2, 7.0, 137.0) * 0.85;
  result += staticDroplets(uv, 14.0, 11.0);
  result += staticDroplets(uv * 1.6 + 9.0, 20.0, 71.0) * 0.7;

  vec2 refraction = result.xy * 0.35;
  vec4 color = texture(u_texture, uv + refraction);

  // Subtle brightening where a drop's curved surface catches the light.
  color.rgb += result.z * 0.5;

  outColor = color;
}
</script>

<script type="module">
import * as THREE from 'three';

const rainVertShader = document.getElementById('rain-vert').textContent;
const rainFragShader = document.getElementById('rain-frag').textContent;

async function main() {
  const app = document.querySelector('#app');

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 7;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  app.appendChild(renderer.domElement);

  const textureLoader = new THREE.TextureLoader();

  // Placeholder image (soft night-lights gradient) so the demo works without
  // any external asset. Swap this for your own background.jpg in your project.
  const defaultTexture = makeDefaultTexture();

  let plane = null;

  function buildPlane(texture) {
    if (plane) {
      scene.remove(plane);
      plane.geometry.dispose();
      plane.material.dispose();
    }

    const aspectRatio = texture.image.height / texture.image.width;
    const planeHeight = 10;
    const planeWidth = planeHeight / aspectRatio;

    const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight, 1, 1);

    const material = new THREE.ShaderMaterial({
      vertexShader: rainVertShader,
      fragmentShader: rainFragShader,
      glslVersion: THREE.GLSL3, // required since the shaders use `in`/`out` and texture()
      uniforms: {
        u_time: { value: 0 },
        u_texture: { value: texture },
      },
    });

    plane = new THREE.Mesh(geometry, material);
    scene.add(plane);

    fitCameraToPlane(planeWidth, planeHeight);
  }

  function fitCameraToPlane(width, height) {
    const aspect = window.innerWidth / window.innerHeight;
    const targetAspect = width / height;
    // Pull the camera back just enough that the plane fills the shorter axis.
    const vFov = (camera.fov * Math.PI) / 180;
    const distForHeight = (height / 2) / Math.tan(vFov / 2);
    const distForWidth = distForHeight / (aspect / targetAspect);
    camera.position.z = Math.max(distForHeight, distForWidth) * 1.02;
  }

  buildPlane(defaultTexture);

  function animationFrame(time) {
    if (plane) plane.material.uniforms.u_time.value = time / 1000;
    renderer.render(scene, camera);
    requestAnimationFrame(animationFrame);
  }
  requestAnimationFrame(animationFrame);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // File picker to try your own image.
  const fileInput = document.getElementById('file-input');
  document.getElementById('pick-btn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    textureLoader.load(url, (texture) => {
      texture.colorSpace = THREE.SRGBColorSpace;
      buildPlane(texture);
    });
  });

  function makeDefaultTexture() {
    // High-contrast scene (sharp lines, dots, bright text) so UV refraction
    // from the drops is obvious the moment the page loads — a flat gradient
    // barely shows any distortion since there's nothing sharp to bend.
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 683;
    const ctx = c.getContext('2d');

    const g = ctx.createLinearGradient(0, 0, 0, c.height);
    g.addColorStop(0, '#0e1626');
    g.addColorStop(0.55, '#131c2c');
    g.addColorStop(1, '#05070c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, c.width, c.height);

    // Sharp grid lines — the classic way to make refraction visible.
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    const step = 48;
    for (let x = 0; x <= c.width; x += step) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, c.height);
      ctx.stroke();
    }
    for (let y = 0; y <= c.height; y += step) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(c.width, y);
      ctx.stroke();
    }

    // Bright city-light dots with hard edges.
    const rand = (a, b) => a + Math.random() * (b - a);
    for (let i = 0; i < 90; i++) {
      const x = rand(0, c.width);
      const y = rand(0, c.height);
      const r = rand(4, 16);
      const hue = Math.random() < 0.5 ? '255,205,120' : '150,210,255';
      ctx.fillStyle = `rgba(${hue},0.95)`;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `rgba(${hue},0.5)`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y, r * 1.8, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Bold text — letters are great at revealing lens-like distortion.
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 120px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('RAIN', c.width / 2, c.height / 2);

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
}

main();
</script>
</body>
</html>
